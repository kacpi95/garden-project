<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>garden-project</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <a href="/" class="header__logo"
            ><img src="/images/logo/logo-header.svg" alt="Giarddesign logo"
          /></a>
          <nav class="header__nav">
            <ul class="header__menu">
              <li class="header__item header__item--dropdown">
                <a href="#" class="header__link">
                  <span>Oferta</span>
                  <img
                    class="header__arrow"
                    src="/images/icons/arrow-down-black-nav.svg"
                    alt=""
                  />
                </a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">O firmie</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">Realizacje</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">Kontakt</a>
              </li>
              <li class="header__item">
                <button class="header__search" aria-label="Search">
                  <img
                    src="/images/icons/search.svg"
                    alt=""
                    aria-hidden="true"
                  />
                </button>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <section class="hero">
      <div class="container">
        <div class="row hero__wrapper">
          <div class="col-12 col-lg-6">
            <div class="hero__content">
              <h1 class="hero__title">Nowoczesna aranżacja Twojego ogrodu</h1>
              <p class="hero__text">
                Marka GiardDesign to wieloletnie doświadczenie i wysoka estetyka
                realizacji. Oferujemy kompleksowy zakres usług z indywidualnym
                podejściem do każdego projektu.
              </p>
              <div class="hero__buttons">
                <a href="#contact" class="hero__button hero__button--primary">
                  Skontaktuj się z nami
                </a>
                <a
                  href="#projects"
                  class="hero__button hero__button--secondary"
                >
                  <span>Zobacz nasze realizacje</span>
                  <img
                    src="/images/icons/arrow-down-green.svg"
                    alt=""
                    aria-hidden="true"
                  />
                </a>
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-6">
            <div class="hero__image">
              <img
                class="hero__photo"
                src="/images/hero/hero.webp"
                alt="Nowoczesna aranżacja ogrodu"
              />
              <div class="hero__controls">
                <button
                  class="hero__control hero__control--prev"
                  type="button"
                  aria-label="Poprzedni slajd"
                >
                  <img
                    src="/images/icons/arrow-left-black.svg"
                    alt=""
                    aria-hidden="true"
                  />
                </button>
                <button
                  class="hero__control hero__control--next"
                  type="button"
                  aria-label="Następny slajd"
                >
                  <img
                    src="/images/icons/arrow-right-black.svg"
                    alt=""
                    aria-hidden="true"
                  />
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
